<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>露營小站 ⛺</title>
<meta name="description" content="露營菜單 LIST 與揪團報名表">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe4;--card:#fffdf8;--ink:#2b2a25;--muted:#7a7466;--line:#e4dccb;--forest:#2f5d46;--ember:#d9682b;--shadow:0 1px 2px rgba(60,50,30,.06),0 6px 20px rgba(60,50,30,.08)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:34px 22px 110px;color:#fff;
  background:linear-gradient(180deg,#1f3d31 0%,#2f5d46 60%,#3f7a5c 100%);box-shadow:var(--shadow)}
.hero .stars{position:absolute;inset:0;background-image:
  radial-gradient(1.5px 1.5px at 20% 22%,rgba(255,255,255,.8),transparent),
  radial-gradient(1px 1px at 70% 15%,rgba(255,255,255,.7),transparent),
  radial-gradient(1.5px 1.5px at 85% 35%,rgba(255,255,255,.6),transparent),
  radial-gradient(1px 1px at 40% 10%,rgba(255,255,255,.6),transparent),
  radial-gradient(1px 1px at 55% 30%,rgba(255,255,255,.5),transparent)}
.hero .moon{position:absolute;right:26px;top:24px;width:34px;height:34px;border-radius:50%;background:#f6e7c1;box-shadow:0 0 24px rgba(246,231,193,.5)}
.hero .tag{position:relative;display:inline-block;font-size:13px;font-weight:700;letter-spacing:.12em;background:rgba(255,255,255,.15);padding:4px 12px;border-radius:99px}
.hero h1{position:relative;margin:14px 0 6px;font-size:30px;font-weight:900;line-height:1.2}
.hero p{position:relative;margin:0;opacity:.85}
.hero svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:96px;display:block}
.cards{display:grid;gap:14px;margin-top:-50px;position:relative;padding:0 6px}
.card{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 18px;text-decoration:none;color:inherit;box-shadow:var(--shadow);transition:transform .12s}
.card:active{transform:scale(.98)}
.card:hover{transform:translateY(-2px)}
.ico{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:30px}
.ico.a{background:#f3e7d3}
.ico.b{background:#e3eee6}
.txt{flex:1;min-width:0}
.txt h2{margin:0;font-size:20px;font-weight:900}
.txt h2 small{font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-left:6px}
.txt p{margin:4px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
.arrow{flex:none;font-size:22px;color:var(--forest);font-weight:900}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="stars"></div><div class="moon"></div>
    <span class="tag">⛺ CAMPING</span>
    <h1>露營小站</h1>
    <p>菜單備料、揪團報名，一站搞定</p>
    <svg viewBox="0 0 400 96" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 96 L0 62 L60 22 L110 58 L170 10 L240 64 L300 30 L350 56 L400 36 L400 96 Z" fill="rgba(255,255,255,.08)"/>
      <path d="M0 96 L0 76 L80 50 L150 78 L230 44 L310 80 L400 60 L400 96 Z" fill="rgba(0,0,0,.12)"/>
    </svg>
  </div>

  <div class="cards">
    <a class="card" href="list.html">
      <div class="ico a">🍳</div>
      <div class="txt"><h2>露營 LIST<small>MENU</small></h2><p>規劃每一餐菜單和備料清單，和露友一起編輯</p></div>
      <div class="arrow">›</div>
    </a>
    <a class="card" href="signup.html">
      <div class="ico b">📝</div>
      <div class="txt"><h2>報名表<small>SIGN UP</small></h2><p>開一團露營，朋友點連結就能選方案報名</p></div>
      <div class="arrow">›</div>
    </a>
  </div>

  <p class="foot">🌲 好天氣、好營地、好夥伴</p>
</div>
</body>
</html>
